<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>దీపావళి శుభాకాంక్షలు 🪔</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #2a0845 0%, #120024 60%, #05000a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.4), inset 0 0 15px rgba(255, 215, 0, 0.2);
            max-width: 420px;
            width: 90%;
            z-index: 10;
            position: relative;
        }
        h1 {
            color: #ffd700;
            font-size: 2.3rem;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 69, 0, 0.6);
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #ffaa00;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
        }
        .diya-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }
        .diya-img {
            font-size: 40px;
            animation: flicker 1.2s infinite alternate ease-in-out;
        }
        .diya-img:nth-child(2) {
            animation-delay: 0.4s;
        }
        @keyframes flicker {
            0% { transform: scale(0.95); opacity: 0.85; filter: drop-shadow(0 0 5px #ff9900); }
            100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 20px #ff3300); }
        }
        p {
            font-size: 1.05rem;
            margin-bottom: 25px;
            color: #fffae6;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: #ffcc00;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ffcc00;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }
        input[type="text"]::placeholder {
            color: #aaa;
        }
        .whatsapp-btn {
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }
        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
        }
        .whatsapp-btn:active {
            transform: translateY(1px);
        }
        .sender-name-display {
            margin-top: 15px;
            font-size: 1.3rem;
            color: #ff9900;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.5);
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <div class="diya-row">
            <div class="diya-img">🪔</div>
            <div class="diya-img">✨</div>
            <div class="diya-img">🪔</div>
        </div>
        <h1>దీపావళి శుభాకాంక్షలు</h1>
        <div class="subtitle">శ్రీ మహాలక్ష్మి కృపాకటాక్షాలు కలగాలి!</div>
        <p>మీకు, మీ కుటుంబ సభ్యులకు దివ్య దీపావళి పండుగ శుభాకాంక్షలు. ఈ వెలుగుల పండుగ మీ ఇంట సిరిసంపదలను, సుఖసంతోంలను నింపాలని మనసారా కోరుకుంటూ...</p>
        
        <div class="input-group">
            <label for="senderName">మీ పేరు ఇక్కడ నమోదు చేయండి:</label>
            <input type="text" id="senderName" placeholder="ఉదా: రమణ..." oninput="updateName()">
        </div>

        <div id="displayArea" class="sender-name-display"></div>
        <br>
        <button class="whatsapp-btn" onclick="shareOnWhatsApp()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.068 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.926-7.93 0-2.11-.822-4.102-2.323-5.607zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.558 6.558 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.833-.307-1.585-.977-.585-.522-.979-1.17-1.094-1.368-.114-.197-.012-.304.087-.401.089-.088.197-.232.295-.35.098-.119.13-.198.197-.33.065-.133.032-.248-.016-.347-.049-.099-.445-1.072-.61-1.47-.16-.389-.323-.337-.445-.343-.112-.005-.24-.005-.368-.005-.127 0-.334.048-.51.243-.178.197-.679.663-.679 1.618 0 .955.696 1.875.793 2.004.098.13 1.366 2.086 3.308 2.924.462.2.822.319 1.103.408.465.148.888.127 1.221.077.373-.056 1.17-.478 1.334-.941.164-.464.164-.862.114-.941-.049-.079-.182-.128-.379-.227z"/>
            </svg>
            వాట్సాప్‌లో షేర్ చేయండి
        </button>
    </div>

    <script>
        // Web Audio API for Realistic Firework Sound Effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playCrackerSound() {
            try {
                initAudio();
                if (!audioCtx) return;

                // Create noise buffer for burst/crackle
                const bufferSize = audioCtx.sampleRate * 0.8; // 0.8 seconds
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // Filter for explosion thud & hiss
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.75);

                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                noise.start();
            } catch (e) {
                console.log("Audio not allowed yet");
            }
        }

        // Unlock audio on first user interaction anywhere on page
        window.addEventListener('click', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        // Canvas Fireworks Animation
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1.2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.012 + 0.006;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.06; // gravity
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                const colors = ['#ff3333', '#ffd700', '#33ccff', '#ff66ff', '#ffffff', '#ff9900', '#66ff66'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const particleCount = Math.floor(Math.random() * 50) + 50;
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(new Particle(this.x, this.y, color));
                }
                playCrackerSound();
            }
            update() {
                this.particles.forEach((p, index) => {
                    p.update();
                    if (p.alpha <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
            }
            draw() {
                this.particles.forEach(p => p.draw());
            }
        }

        let fireworks = [];

        function addFirework() {
            const x = Math.random() * (canvas.width - 100) + 50;
            const y = Math.random() * (canvas.height * 0.5);
            fireworks.push(new Firework(x, y));
        }

        function animate() {
            ctx.fillStyle = 'rgba(18, 0, 36, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach((fw, index) => {
                fw.update();
                fw.draw();
                if (fw.particles.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        setInterval(addFirework, 900);
        animate();

        function updateName() {
            const name = document.getElementById('senderName').value.trim();
            const displayArea = document.getElementById('displayArea');
            if (name) {
                displayArea.innerHTML = `శుభాకాంక్షలతో: ${name} 🪔`;
            } else {
                displayArea.innerHTML = '';
            }
        }

        function shareOnWhatsApp() {
            const name = document.getElementById('senderName').value.trim();
            let message = "🪔 మీకు, మీ కుటుంబ సభ్యులకు దివ్య దీపావళి శుభాకాంక్షలు! 🪔\n\nఈ వెలుగుల పండుగ మీ ఇంట సిరిసంపదలను, సుఖసంతోంలను నింపాలని మనసారా కోరుకుంటూ...";
            if (name) {
                message += `\n\nఇట్లు మీ: *${name}*`;
                message += `\n\nhttps://joyfun.in/deepavali.in`;
            }
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
