<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>దీపావళి శుభాకాంక్షలు</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle, #1a0033 0%, #0d001a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 165, 0, 0.3);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative;
        }
        h1 {
            color: #ffcc00;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }
        .diya-img {
            font-size: 50px;
            margin: 10px 0;
            animation: flicker 1.5s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 0.8; text-shadow: 0 0 10px #ff9900; }
            100% { opacity: 1; text-shadow: 0 0 25px #ff3300; }
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #ffeb99;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #ffcc00;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ffcc00;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]::placeholder {
            color: #888;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
            transform: scale(1.02);
        }
        .sender-name-display {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ff9900;
            font-weight: bold;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <div class="diya-img">🪔</div>
        <h1>దీపావళి శుభాకాంక్షలు</h1>
        <p>మీకు, మీ కుటుంబ సభ్యులకు సిరుల పంట పండాలని, ఆయురారోగ్యాలతో సుఖసంతోంలతో వర్ధిల్లాలని మనసారా కోరుకుంటూ...</p>
        
        <div class="input-group">
            <label for="senderName">మీ పేరు నమోదు చేయండి:</label>
            <input type="text" id="senderName" placeholder="ఇక్కడ మీ పేరు రాయండి..." oninput="updateName()">
        </div>

        <div id="displayArea" class="sender-name-display"></div>
        <br>
        <button class="whatsapp-btn" onclick="shareOnWhatsApp()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.068 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.926-7.93 0-2.11-.822-4.102-2.323-5.607zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.558 6.558 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.833-.307-1.585-.977-.585-.522-.979-1.17-1.094-1.368-.114-.197-.012-.304.087-.401.089-.088.197-.232.295-.35.098-.119.13-.198.197-.33.065-.133.032-.248-.016-.347-.049-.099-.445-1.072-.61-1.47-.16-.389-.323-.337-.445-.343-.112-.005-.24-.005-.368-.005-.127 0-.334.048-.51.243-.178.197-.679.663-.679 1.618 0 .955.696 1.875.793 2.004.098.13 1.366 2.086 3.308 2.924.462.2.822.319 1.103.408.465.148.888.127 1.221.077.373-.056 1.17-.478 1.334-.941.164-.464.164-.862.114-.941-.049-.079-.182-.128-.379-.227z"/>
            </svg>
            వాట్సాప్‌లో షేర్ చేయండి
        </button>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // gravity
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];
                const colors = ['#ff3333', '#ffcc00', '#33ccff', '#ff66ff', '#ffffff', '#66ff66'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                const particleCount = Math.floor(Math.random() * 40) + 40;
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(new Particle(this.x, this.y, color));
                }
            }
            update() {
                this.particles.forEach((p, index) => {
                    p.update();
                    if (p.alpha <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
            }
            draw() {
                this.particles.forEach(p => p.draw());
            }
        }

        let fireworks = [];

        function addFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.6);
            fireworks.push(new Firework(x, y));
        }

        function animate() {
            ctx.fillStyle = 'rgba(13, 0, 26, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach((fw, index) => {
                fw.update();
                fw.draw();
                if (fw.particles.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        // ఆటోమేటిక్‌గా బాణసంచా పేలడానికి
        setInterval(addFirework, 700);
        animate();

        function updateName() {
            const name = document.getElementById('senderName').value.trim();
            const displayArea = document.getElementById('displayArea');
            if (name) {
                displayArea.innerHTML = `శుభాకాంక్షలతో: ${name} 🪔`;
            } else {
                displayArea.innerHTML = '';
            }
        }

        function shareOnWhatsApp() {
            const name = document.getElementById('senderName').value.trim();
            let message = "🪔 మీకు, మీ కుటుంబ సభ్యులకు దీపావళి శుభాకాంక్షలు! 🪔\n\nఈ దీపావళి మీ జీవితంలో సుఖసంతోంలతో పాటు సిరిసంపదలను నింపాలని మనసారా కోరుకుంటూ...";
            if (name) {
                message += `\n\nఇట్లు మీ: *${name}*`;
            }
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
